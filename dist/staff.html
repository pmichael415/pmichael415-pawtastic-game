<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>PAWtastic Referral Desk</title>
<link rel="icon" href="/favicon.ico">
<style>
:root{--brand:#0068D6;--ink:#31271F;--bg:#FAF8F5;--muted:#6B5E55;--gold:#F6A823;font:16px/1.45 "DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}
*{box-sizing:border-box}body{margin:0}#staff{max-width:760px;margin:0 auto;padding:16px 16px 48px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;gap:12px}.top h1{margin:0;font-size:1.5rem;color:var(--brand)}.top img{border-radius:10px}.top .link{margin-left:auto}
.eyebrow{margin:0;font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 1px 3px rgba(49,39,31,.12)}
.stack{display:flex;flex-direction:column;gap:10px}h2,h3{margin:0}p{margin:0}
label{font-weight:600}input,select{font:inherit;padding:12px;border:2px solid #D9D2CA;border-radius:10px;width:100%;background:#fff}
input:focus,select:focus{outline:3px solid #9FC6F2;border-color:var(--brand)}
.code-input{font-size:1.6rem;letter-spacing:.2em;text-transform:uppercase;font-weight:700}
.btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:14px 18px;background:var(--brand);color:#fff;cursor:pointer;min-height:48px}
.btn:disabled{opacity:.6}.btn.small{padding:8px 12px;min-height:40px;background:var(--gold);color:var(--ink)}
.link{font:inherit;background:none;border:0;color:var(--brand);text-decoration:underline;cursor:pointer;padding:6px}
.muted{color:var(--muted);font-size:.9rem}.note{min-height:1.2em;color:#B03A2E}.ok{background:#E8F5EC;color:#1E5B33;font-weight:600}
.code{font-size:2.2rem;font-weight:700;letter-spacing:.22em;color:var(--brand)}.big{font-size:1.1rem;font-weight:600}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;border:1px solid #EEE7DF;border-radius:10px;padding:10px}
.row.void{opacity:.55}.row-side{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tag{font-size:.8rem;font-weight:700;padding:4px 8px;border-radius:999px;background:#EEE7DF}.tag.earned{background:#FFF0CC}.tag.bath-given{background:#E8F5EC}
ol{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}.signed{text-align:right}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}.stat{border:1px solid #EEE7DF;border-radius:10px;padding:10px}
.stat .big{font-size:1.35rem;color:var(--brand)}.report h3{font-size:1rem;margin-top:6px}.report .link[aria-pressed="true"]{font-weight:700;text-decoration:none;background:#EEF4FC;border-radius:8px}
</style>
</head>
